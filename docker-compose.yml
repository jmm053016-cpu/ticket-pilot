services:
  mysql:
    image: mysql:8.4
    container_name: ai-ticket-mysql
    # 时区设计（重要）：MySQL 全局时区固定 +08:00，所以 Navicat 等人工会话直接看到北京时间。
    # 应用侧不靠这个参数保证正确性——它在 JDBC URL 里用
    # connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true 把"自己的连接"钉成 UTC
    # （Hibernate 绑 Instant 时按 UTC 墙钟时间，必须配 UTC 会话）。详见 PROJECT_OVERVIEW.md §6.4。
    command: --default-time-zone=+08:00
    environment:
      MYSQL_DATABASE: ai_ticket_assistant
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ai-ticket-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ai_ticket_assistant?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      CORS_ALLOWED_ORIGINS: http://localhost:15173,http://127.0.0.1:15173,http://localhost:5173,http://127.0.0.1:5173
      AI_PROVIDER: ${AI_PROVIDER:-fallback}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1/chat/completions}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-2000}
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:18080
    container_name: ai-ticket-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "15173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mysql-data:
